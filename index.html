<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chinese">
<meta name="mobile-web-app-capable" content="yes">
<title>Chinese</title>
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.3/dist/hanzi-writer.min.js"></script>
<style>
  :root{
    --paper:#F6F0E4;
    --paper-2:#EFE6D3;
    --ink:#2A2620;
    --ink-soft:#6B6357;
    --seal:#A8402E;
    --seal-soft:#C9755F;
    --line:#D9CDB4;
  }
  *{box-sizing:border-box;}
  html, body{
    height:100%;
  }
  body{
    margin:0;
    min-height:100dvh;
    background:var(--paper);
    color:var(--ink);
    font-family: "Songti SC","STSong","Noto Serif SC",Georgia,serif;
    padding:calc(32px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(56px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
  }
  .wrap{max-width:920px;margin:0 auto;}
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:8px;
    flex-wrap:wrap;
    gap:8px;
  }
  h1{
    font-size:26px;
    font-weight:600;
    margin:0;
    letter-spacing:0.5px;
  }
  .sub{
    font-size:13px;
    color:var(--ink-soft);
    font-family:Georgia,serif;
    font-style:italic;
  }
  .stamp{
    width:40px;height:40px;
    border:2.5px solid var(--seal);
    color:var(--seal);
    display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:700;
    border-radius:3px;
    flex-shrink:0;
  }
  .section-title{
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:2px;
    color:var(--seal);
    font-family:Georgia,serif;
    margin:40px 0 4px;
  }
  .section-phrase{
    font-size:15px;
    color:var(--ink-soft);
    margin:0 0 16px;
    font-family:Georgia,serif;
  }
  .phrase-en{color:var(--ink);font-style:normal;}
  .card-row{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
  }
  .card{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:6px;
    padding:14px 14px 12px;
    width:150px;
    text-align:center;
    flex-shrink:0;
  }
  .canvas-holder{
    width:120px;height:120px;
    margin:0 auto 8px;
    background:#FFFDF8;
    border:1px solid var(--line);
    border-radius:4px;
    position:relative;
  }
  .canvas-holder svg{position:absolute;top:0;left:0;}
  .grid-bg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
  .pinyin{
    font-family:Georgia,serif;
    font-size:14px;
    color:var(--ink);
    margin:2px 0 0;
    font-weight:600;
  }
  .gloss{
    font-family:Georgia,serif;
    font-size:11px;
    color:var(--ink-soft);
    margin:1px 0 8px;
    min-height:13px;
  }
  button.replay{
    font-family:Georgia,serif;
    font-size:11px;
    letter-spacing:0.5px;
    background:transparent;
    border:1px solid var(--seal-soft);
    color:var(--seal);
    padding:4px 10px;
    border-radius:20px;
    cursor:pointer;
  }
  button.replay:hover{background:var(--seal);color:var(--paper);}
  button.replay:active{transform:scale(0.96);}
  .full-line{
    margin-top:12px;
    font-size:13px;
    color:var(--ink-soft);
    font-family:Georgia,serif;
  }
  .full-line b{color:var(--ink);font-weight:600;}
  footer{
    margin-top:44px;
    border-top:1px solid var(--line);
    padding-top:12px;
    font-size:12px;
    color:var(--ink-soft);
    font-family:Georgia,serif;
    text-align:center;
  }
  .mode-toggle{
    display:flex;
    gap:8px;
    margin:20px 0 4px;
  }
  .mode-btn{
    flex:1;
    font-family:Georgia,serif;
    font-size:13px;
    letter-spacing:0.3px;
    padding:11px 8px;
    border:1px solid var(--line);
    background:var(--paper-2);
    color:var(--ink-soft);
    border-radius:8px;
    cursor:pointer;
  }
  .mode-btn.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }
  .view{display:none;}
  .view.active{display:block;}
  .progress-bar{
    height:5px;
    background:var(--line);
    border-radius:3px;
    overflow:hidden;
    margin:22px 0 6px;
    max-width:320px;
    margin-left:auto;
    margin-right:auto;
  }
  .progress-fill{
    height:100%;
    background:var(--seal);
    width:0%;
    transition:width .25s;
  }
  .progress-text{
    font-size:12px;
    color:var(--ink-soft);
    font-family:Georgia,serif;
    text-align:center;
    margin-bottom:24px;
  }
  .flash-card{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:14px;
    max-width:320px;
    margin:0 auto;
    padding:36px 20px;
    text-align:center;
    cursor:pointer;
    min-height:230px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .flash-hz{
    font-size:96px;
    line-height:1;
    margin-bottom:6px;
  }
  .flash-answer{display:none;}
  .flash-answer.show{display:block;}
  .flash-py{
    font-size:22px;
    font-weight:600;
    font-family:Georgia,serif;
    margin-bottom:4px;
    color:var(--seal);
  }
  .flash-en{
    font-size:14px;
    color:var(--ink-soft);
    font-family:Georgia,serif;
  }
  .flash-hint{
    font-size:12px;
    color:var(--ink-soft);
    font-family:Georgia,serif;
    margin-top:16px;
  }
  .flash-actions{
    display:flex;
    gap:10px;
    max-width:320px;
    margin:16px auto 0;
  }
  .flash-actions button{
    flex:1;
    font-family:Georgia,serif;
    font-size:14px;
    padding:13px;
    border-radius:8px;
    cursor:pointer;
  }
  .btn-again{background:transparent;border:1px solid var(--seal-soft);color:var(--seal);}
  .btn-good{background:var(--ink);border:1px solid var(--ink);color:var(--paper);}
  .practice-done{
    text-align:center;
    padding:50px 0;
    font-family:Georgia,serif;
  }
  .practice-done button{
    margin-top:16px;
    font-family:Georgia,serif;
    font-size:14px;
    padding:10px 22px;
    border-radius:20px;
    border:1px solid var(--seal-soft);
    background:transparent;
    color:var(--seal);
    cursor:pointer;
  }
  .practice-topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    max-width:320px;
    margin:18px auto 0;
  }
  .exit-practice{
    font-family:Georgia,serif;
    font-size:12px;
    background:none;
    border:1px solid var(--line);
    color:var(--ink-soft);
    padding:5px 10px;
    border-radius:14px;
    cursor:pointer;
    flex-shrink:0;
  }
  .exit-practice:hover{border-color:var(--seal-soft);color:var(--seal);}
  .flash-context-row{
    margin-top:12px;
    padding-top:10px;
    border-top:1px dashed var(--line);
    font-family:Georgia,serif;
    font-size:12px;
    line-height:1.5;
    text-align:left;
  }
  .flash-context-label{
    color:var(--ink-soft);
    font-style:italic;
    margin-right:4px;
  }
  .flash-context-hz{
    font-family:"Songti SC","STSong","Noto Serif SC",serif;
    color:var(--ink);
    font-weight:600;
    margin-right:6px;
  }
  .flash-context-py{
    color:var(--seal);
    font-weight:600;
    margin-right:4px;
  }
  .flash-context-en{
    color:var(--ink-soft);
  }
  .flash-context-example{
    border-top:none;
    padding-top:4px;
  }
  .flash-context-breakdown{
    margin-top:3px;
    font-size:11px;
    color:var(--ink-soft);
    font-style:italic;
  }
  .flash-stats-line{
    margin-top:10px;
    padding-top:8px;
    border-top:1px dashed var(--line);
    font-size:11px;
    color:var(--ink-soft);
    font-family:Georgia,serif;
    font-style:italic;
    text-align:center;
  }
  .flash-card{
    position:relative;
  }
  .mastery-dot{
    position:absolute;
    top:12px;
    right:12px;
    width:10px;
    height:10px;
    border-radius:50%;
  }
  .mastery-dot-new{background:var(--line);}
  .mastery-dot-learning{background:var(--seal-soft);}
  .mastery-dot-weak{background:var(--seal);}
  .mastery-dot-medium{background:#B8923F;}
  .mastery-dot-strong{background:#5B7A5B;}
  .reset-stats-btn{
    margin-top:10px;
    font-family:Georgia,serif;
    font-size:11px;
    background:none;
    border:none;
    color:var(--ink-soft);
    text-decoration:underline;
    cursor:pointer;
    padding:4px;
  }
  .search-wrap{
    position:relative;
    margin:18px 0 8px;
  }
  .search-wrap input{
    width:100%;
    box-sizing:border-box;
    font-family:Georgia,serif;
    font-size:14px;
    padding:11px 36px 11px 14px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--paper-2);
    color:var(--ink);
  }
  .search-wrap input::placeholder{color:var(--ink-soft);}
  .search-wrap input:focus{outline:none;border-color:var(--seal-soft);}
  .search-clear{
    position:absolute;
    right:8px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:16px;
    cursor:pointer;
    display:none;
    padding:4px 6px;
  }
  .search-hint{
    font-size:12px;
    color:var(--ink-soft);
    font-family:Georgia,serif;
    margin-bottom:8px;
  }
  .no-results{
    text-align:center;
    color:var(--ink-soft);
    font-family:Georgia,serif;
    font-size:14px;
    padding:30px 0;
    display:none;
  }
  .offline-banner{
    background:#F3E6DC;
    border:1px solid var(--seal-soft);
    color:var(--seal);
    font-family:Georgia,serif;
    font-size:12px;
    padding:9px 12px;
    border-radius:8px;
    margin-bottom:14px;
    text-align:center;
  }
  .setup-wrap{
    max-width:420px;
    margin:20px auto 0;
    font-family:Georgia,serif;
  }
  .setup-title{
    font-size:16px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:2px;
  }
  .setup-sub{
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:16px;
  }
  .setup-block{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:14px;
  }
  .setup-block-label{
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:10px;
  }
  .setup-quickbtns{
    display:flex;
    gap:8px;
    margin-bottom:10px;
  }
  .setup-quickbtns button{
    font-family:Georgia,serif;
    font-size:11px;
    background:none;
    border:1px solid var(--line);
    color:var(--ink-soft);
    padding:4px 10px;
    border-radius:12px;
    cursor:pointer;
  }
  .setup-quickbtns button:hover{border-color:var(--seal-soft);color:var(--seal);}
  .section-checklist{
    max-height:220px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:7px;
  }
  .section-check-row{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--ink);
  }
  .section-check-row input{accent-color:var(--seal);}
  .section-check-count{
    color:var(--ink-soft);
    font-size:11px;
    margin-left:auto;
  }
  .setup-toggle-row{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--ink);
  }
  .setup-toggle-row input{accent-color:var(--seal);}
  .setup-select-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:13px;
    color:var(--ink);
  }
  .setup-select-row select{
    font-family:Georgia,serif;
    font-size:13px;
    padding:5px 8px;
    border-radius:6px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
  }
  .setup-pool-count{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    margin:4px 0 16px;
  }
  .setup-actions{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .setup-btn-primary{
    font-family:Georgia,serif;
    font-size:14px;
    background:var(--ink);
    border:1px solid var(--ink);
    color:var(--paper);
    padding:12px;
    border-radius:8px;
    cursor:pointer;
  }
  .setup-btn-secondary{
    font-family:Georgia,serif;
    font-size:13px;
    background:none;
    border:1px solid var(--seal-soft);
    color:var(--seal);
    padding:10px;
    border-radius:8px;
    cursor:pointer;
  }
  .change-session-btn{
    font-family:Georgia,serif;
    font-size:12px;
    background:none;
    border:1px solid var(--line);
    color:var(--ink-soft);
    padding:5px 10px;
    border-radius:14px;
    cursor:pointer;
    flex-shrink:0;
  }
  .change-session-btn:hover{border-color:var(--seal-soft);color:var(--seal);}
  .readthrough-header{
    max-width:420px;
    margin:0 auto 6px;
    font-family:Georgia,serif;
    font-size:13px;
    color:var(--ink-soft);
    text-align:center;
  }
  .honesty-note{
    text-align:center;
    font-size:11px;
    font-style:italic;
    color:var(--ink-soft);
    font-family:Georgia,serif;
    margin-top:8px;
    max-width:320px;
    margin-left:auto;
    margin-right:auto;
  }
  .mastery-breakdown-bar{
    display:flex;
    height:10px;
    border-radius:5px;
    overflow:hidden;
    background:var(--line);
    margin-bottom:10px;
  }
  .mb-segment{height:100%;}
  .mb-strong{background:#5B7A5B;}
  .mb-medium{background:#B8923F;}
  .mb-learning{background:var(--seal-soft);}
  .mb-weak{background:var(--seal);}
  .mb-new{background:var(--line);}
  .mastery-breakdown-legend{
    display:flex;
    flex-wrap:wrap;
    gap:8px 14px;
    font-size:11px;
    color:var(--ink-soft);
  }
  .mb-dot{
    display:inline-block;
    width:8px;
    height:8px;
    border-radius:50%;
    margin-right:4px;
  }
  .section-block.hidden,
  .card.hidden,
  .full-line.hidden{
    display:none !important;
  }
  .pinyin-list{
    columns: 1;
  }
  .pinyin-row{
    padding:9px 0;
    border-bottom:1px dashed var(--line);
    display:flex;
    align-items:baseline;
    flex-wrap:wrap;
    gap:8px;
  }
  .pinyin-row:last-child{border-bottom:none;}
  .pinyin-main{
    font-family:Georgia,serif;
    font-size:15px;
    font-weight:600;
    color:var(--ink);
  }
  .pinyin-hz{
    font-family:"Songti SC","STSong","Noto Serif SC",serif;
    font-size:13px;
    color:var(--seal-soft);
  }
  .pinyin-en{
    font-family:Georgia,serif;
    font-size:12.5px;
    color:var(--ink-soft);
    width:100%;
    margin-top:-2px;
  }
  .pinyin-row.pinyin-line .pinyin-main{
    font-weight:600;
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div>
    <h1>Chinese</h1>
  </div>
  <div class="stamp">中</div>
</header>

<div class="mode-toggle">
  <button class="mode-btn active" id="btn-browse">Browse &amp; stroke order</button>
  <button class="mode-btn" id="btn-practice">Practice (quiz)</button>
  <button class="mode-btn" id="btn-pinyin">Pinyin only</button>
</div>

<div id="browseView" class="view active">
  <div class="offline-banner" id="offline-banner" style="display:none;">
    You're offline — stroke animations need a connection. Practice quiz and Pinyin view work fine without one.
  </div>
  <div class="search-wrap">
    <input type="text" id="search-input" placeholder="Search by pinyin, character, or meaning — e.g. 'li'" autocomplete="off">
    <button class="search-clear" id="search-clear">✕</button>
  </div>
  <div class="search-hint" id="search-hint" style="display:none;"></div>
  <div id="app"></div>
  <div class="no-results" id="no-results">No characters match that search.</div>
</div>

<div id="practiceView" class="view"></div>

<div id="pinyinView" class="view"></div>

<footer>Tap or click any character to watch it write itself, stroke by stroke.</footer>
</div>

<script>
const sections = [
  {
    title: "Greetings",
    phrase: null,
    items: [
      { hz: "早", py: "zǎo", en: "morning" },
      { hz: "上", py: "shàng", en: "on/above (in 早上 'morning', 晚上 'evening')" },
      { hz: "中", py: "zhōng", en: "middle" },
      { hz: "午", py: "wǔ", en: "noon" },
      { hz: "下", py: "xià", en: "down/after" },
      { hz: "晚", py: "wǎn", en: "evening" },
      { hz: "好", py: "hǎo", en: "good" },
      { hz: "我", py: "wǒ", en: "I" },
      { hz: "的", py: "de", en: "'s" },
      { hz: "文", py: "wén", en: "language" },
      { hz: "不", py: "bù", en: "not" },
      { hz: "太", py: "tài", en: "too" },
      { hz: "但", py: "dàn", en: "but" },
      { hz: "是", py: "shì", en: "to be" },
      { hz: "会", py: "huì", en: "will/can" },
      { hz: "试", py: "shì", en: "try" },
      { hz: "请", py: "qǐng", en: "please" },
      { hz: "说", py: "shuō", en: "speak" },
      { hz: "慢", py: "màn", en: "slow" },
      { hz: "一", py: "yī", en: "one" },
      { hz: "点", py: "diǎn", en: "a bit" },
      { hz: "儿", py: "ér", en: "suffix (in 一点儿 'a bit')" },
      { hz: "遍", py: "biàn", en: "one full time" },
      { hz: "再", py: "zài", en: "again" },
      { hz: "也", py: "yě", en: "also/too" },
      { hz: "很", py: "hěn", en: "very" },
      { hz: "高", py: "gāo", en: "tall/high (in 高兴 'happy')" },
      { hz: "兴", py: "xìng", en: "excited (in 高兴 'happy')" },
      { hz: "认", py: "rèn", en: "recognize (in 认识 'to know someone')" },
      { hz: "识", py: "shí", en: "know (in 认识 'to know someone')" },
      { hz: "你", py: "nǐ", en: "you" }
    ],
    lines: [
      ["早上好", "zǎoshang hǎo", "good morning"],
      ["中午好", "zhōngwǔ hǎo", "good noon"],
      ["下午好", "xiàwǔ hǎo", "good afternoon"],
      ["晚上好", "wǎnshang hǎo", "good evening"],
      ["我的中文不太好，但是我会试试。", "Wǒ de Zhōngwén bú tài hǎo, dànshì wǒ huì shìshi.", "my Chinese isn't very good, but I'll try"],
      ["请说慢一点儿。", "Qǐng shuō màn yìdiǎnr.", "please speak a bit slower"],
      ["请再说一遍。", "Qǐng zài shuō yí biàn.", "please say that again"],
      ["我也很高兴认识你。", "Wǒ yě hěn gāoxìng rènshi nǐ.", "nice to meet you too"]
    ]
  },
  {
    title: "Courtesy & extras",
    phrase: null,
    items: [
      { hz: "谢", py: "xiè", en: "thank" },
      { hz: "不", py: "bù", en: "not" },
      { hz: "客", py: "kè", en: "guest (in 客气 'polite')" },
      { hz: "气", py: "qì", en: "manner/spirit (in 客气 'polite')" },
      { hz: "再", py: "zài", en: "again" },
      { hz: "见", py: "jiàn", en: "see" },

let counter = 0;
const writerMap = new Map(); // holder element -> HanziWriter instance

function ensureWriter(holder, hz) {
  if (writerMap.has(holder)) return writerMap.get(holder);
  const writer = HanziWriter.create(holder, hz, {
    width: 118,
    height: 118,
    padding: 6,
    strokeColor: '#2A2620',
    radicalColor: '#A8402E',
    strokeAnimationSpeed: 1,
    delayBetweenStrokes: 250,
    showOutline: true,
    outlineColor: '#D9CDB4'
  });
  writerMap.set(holder, writer);
  return writer;
}

// Lazy-load: only build + animate a character once its card actually scrolls
// into view, instead of creating all of them (network + render cost) on load.
const lazyObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      const holder = entry.target;
      const hz = holder.dataset.hz;
      const writer = ensureWriter(holder, hz);
      writer.animateCharacter();
      lazyObserver.unobserve(holder);
    }
  });
}, { rootMargin: '300px 0px', threshold: 0.01 });

function normalizePinyin(str) {
  const toneMap = {
    'ā':'a','á':'a','ǎ':'a','à':'a',
    'ē':'e','é':'e','ě':'e','è':'e',
    'ī':'i','í':'i','ǐ':'i','ì':'i',
    'ō':'o','ó':'o','ǒ':'o','ò':'o',
    'ū':'u','ú':'u','ǔ':'u','ù':'u',
    'ǖ':'v','ǘ':'v','ǚ':'v','ǜ':'v','ü':'v'
  };
  return str.toLowerCase().replace(/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü]/g, ch => toneMap[ch] || ch);
}

const searchInput = document.getElementById('search-input');
const searchClear = document.getElementById('search-clear');
const searchHint = document.getElementById('search-hint');
const noResults = document.getElementById('no-results');
const sectionBlocks = document.querySelectorAll('.section-block');

function runSearch() {
  const raw = searchInput.value.trim();
  const query = normalizePinyin(raw);
  searchClear.style.display = raw ? 'block' : 'none';

  if (!query) {
    searchHint.style.display = 'none';
    noResults.style.display = 'none';
    sectionBlocks.forEach(block => {
      block.classList.remove('hidden');
      block.querySelectorAll('.card, .full-line').forEach(el => el.classList.remove('hidden'));
    });
    return;
  }

  let totalMatches = 0;

  sectionBlocks.forEach(block => {
    let blockMatches = 0;
    block.querySelectorAll('.card, .full-line').forEach(el => {
      const matches = el.dataset.search.includes(query);
      el.classList.toggle('hidden', !matches);
      if (matches) blockMatches++;
    });
    block.classList.toggle('hidden', blockMatches === 0);
    totalMatches += blockMatches;
  });

  searchHint.style.display = 'block';
  searchHint.textContent = `${totalMatches} match${totalMatches === 1 ? '' : 'es'} for "${raw}"`;
  noResults.style.display = totalMatches === 0 ? 'block' : 'none';
}

searchInput.addEventListener('input', runSearch);
searchClear.addEventListener('click', () => {
  searchInput.value = '';
  runSearch();
  searchInput.focus();
});

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ---- Persistent per-character stats (localStorage) ----
// Tracks how many times each character has been seen and how often it was
// marked "got it" vs "still learning", so weaker characters can be surfaced
// more often and you can see your own progress over time.
const STATS_KEY = 'hanzi-quiz-stats-v1';

function loadStats() {
  try {
    const raw = localStorage.getItem(STATS_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function saveStats() {
  try {
    localStorage.setItem(STATS_KEY, JSON.stringify(stats));
  } catch (e) {
    // storage unavailable (private browsing, etc.) — fail silently, quiz still works
  }
}

let stats = loadStats();

function recordResult(hz, gotIt) {
  if (!stats[hz]) stats[hz] = { seen: 0, good: 0, again: 0, lastSeen: null };
  stats[hz].seen++;
  if (gotIt) stats[hz].good++; else stats[hz].again++;
  stats[hz].lastSeen = Date.now();
  saveStats();
}

function masteryLevel(hz) {
  const s = stats[hz];
  if (!s || s.seen === 0) return 'new';
  const ratio = s.good / s.seen;
  if (s.seen < 2) return 'learning';
  if (ratio >= 0.8) return 'strong';
  if (ratio >= 0.5) return 'medium';
  return 'weak';
}

const masteryLabel = {
  new: 'not yet practiced',
  learning: 'still learning',
  weak: 'needs work',
  medium: 'getting there',
  strong: 'strong'
};

function resetStats() {
  stats = {};
  saveStats();
  renderCard();
}

const levelWeight = { new: 0.3, learning: 0.4, weak: 0, medium: 0.6, strong: 1 };

// ---- Practice setup: pick sections, skip mastered, pick a session size ----
const SETUP_KEY = 'hanzi-quiz-setup-v1';
function loadSetup() {
  try {
    const raw = localStorage.getItem(SETUP_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { sections: quizSections.slice(), weakOnly: false, sessionSize: 20 };
}
function saveSetup() {
  try { localStorage.setItem(SETUP_KEY, JSON.stringify(setup)); } catch (e) {}
}
let setup = loadSetup();

function sectionCharCount(title) {
  const sec = sections.find(s => s.title === title);
  return sec ? new Set(sec.items.map(it => it.hz)).size : 0;
}

// Practice setup groups the many fine-grained sections into larger thematic
// clusters (~30-40 characters each) so choosing a session isn't 38 checkboxes.
// Browse and Pinyin tabs are unaffected — they still show the original sections.
const quizClusters = [
  { label: "Greetings", sections: ["Greetings"] },
  { label: "Courtesy & reactions", sections: ["Courtesy & extras", "Conversational reactions"] },
  { label: "Ordering & dietary needs", sections: ["Ordering — chicken dumplings", "Ordering — prawn noodles", "Ordering — vegetable rice", "Dietary needs"] },

function clusterCharCount(sectionTitles) {
  const set = new Set();
  sections.filter(s => sectionTitles.includes(s.title)).forEach(sec => {
    sec.items.forEach(it => set.add(it.hz));
  });
  return set.size;
}

function buildPool(selectedTitles, weakOnly) {
  const seenChars = new Set();
  let pool = [];
  sections.filter(s => selectedTitles.includes(s.title)).forEach(sec => {
    sec.items.forEach(it => {
      if (!seenChars.has(it.hz)) { seenChars.add(it.hz); pool.push(it); }
    });
  });
  if (weakOnly) pool = pool.filter(it => masteryLevel(it.hz) !== 'strong');
  return pool;
}

function getMasteryBreakdown() {
  const counts = { new: 0, learning: 0, weak: 0, medium: 0, strong: 0 };
  vocab.forEach(it => { counts[masteryLevel(it.hz)]++; });
  return counts;
}

function renderSetup() {
  practiceStarted = false;
  const pool = buildPool(setup.sections, setup.weakOnly);
  const breakdown = getMasteryBreakdown();

  const checklist = quizClusters.map((cluster, i) => {
    const checked = cluster.sections.every(t => setup.sections.includes(t)) ? 'checked' : '';
    return `
      <label class="section-check-row">
        <input type="checkbox" class="section-check" data-cluster="${i}" ${checked}>
        ${cluster.label}
        <span class="section-check-count">${clusterCharCount(cluster.sections)}</span>
      </label>
    `;
  }).join('');

  practiceView.innerHTML = `
    <div class="setup-wrap">
      <div class="setup-title">Set up this session</div>
      <div class="setup-sub">Pick a focused batch instead of facing all ${vocab.length} at once — small, related chunks stick better.</div>

      <div class="setup-block">
        <div class="setup-block-label">Your progress across all ${vocab.length} characters</div>
        <div class="mastery-breakdown">
          <div class="mastery-breakdown-bar">
            ${['strong', 'medium', 'learning', 'weak', 'new'].map(lvl =>
              breakdown[lvl] > 0 ? `<div class="mb-segment mb-${lvl}" style="flex:${breakdown[lvl]}" title="${masteryLabel[lvl]}: ${breakdown[lvl]}"></div>` : ''
            ).join('')}
          </div>
          <div class="mastery-breakdown-legend">
            <span><i class="mb-dot mb-strong"></i>strong ${breakdown.strong}</span>
            <span><i class="mb-dot mb-medium"></i>getting there ${breakdown.medium}</span>
            <span><i class="mb-dot mb-learning"></i>learning ${breakdown.learning}</span>
            <span><i class="mb-dot mb-weak"></i>needs work ${breakdown.weak}</span>
            <span><i class="mb-dot mb-new"></i>not started ${breakdown.new}</span>
          </div>
        </div>
      </div>

      <div class="setup-block">
        <div class="setup-block-label">Sections to include</div>
        <div class="setup-quickbtns">
          <button id="select-all-btn" type="button">Select all</button>
          <button id="select-none-btn" type="button">Select none</button>
        </div>
        <div class="section-checklist" id="section-checklist">${checklist}</div>
      </div>

      <div class="setup-block">
        <label class="setup-toggle-row">
          <input type="checkbox" id="weak-only-toggle" ${setup.weakOnly ? 'checked' : ''}>
          Skip characters I've already mastered (🟢 strong)
        </label>
      </div>

      <div class="setup-block">
        <div class="setup-select-row">
          <span>Session length</span>
          <select id="session-size-select">
            ${[10, 20, 30, 50, 'all'].map(n =>
              `<option value="${n}" ${String(setup.sessionSize) === String(n) ? 'selected' : ''}>${n === 'all' ? 'Everything selected' : n + ' cards'}</option>`
            ).join('')}
          </select>
        </div>
      </div>

      <div class="setup-pool-count" id="setup-pool-count"></div>

      <div class="setup-actions">
        <button class="setup-btn-secondary" id="read-through-btn">Read through first →</button>
        <button class="setup-btn-primary" id="start-quiz-btn">Start quiz</button>
      </div>
    </div>
  `;

  const updatePoolCount = () => {
    const p = buildPool(setup.sections, setup.weakOnly);
    document.getElementById('setup-pool-count').textContent =
      p.length === 0 ? 'No characters match this selection.' : `${p.length} character${p.length === 1 ? '' : 's'} in this selection`;
  };
  updatePoolCount();

  document.querySelectorAll('.section-check').forEach(cb => {
    cb.addEventListener('change', (e) => {
      const cluster = quizClusters[Number(e.target.dataset.cluster)];
      if (e.target.checked) {
        cluster.sections.forEach(t => { if (!setup.sections.includes(t)) setup.sections.push(t); });
      } else {
        setup.sections = setup.sections.filter(t => !cluster.sections.includes(t));
      }
      saveSetup();
      updatePoolCount();
    });
  });
  document.getElementById('select-all-btn').addEventListener('click', () => {
    document.querySelectorAll('.section-check').forEach(cb => cb.checked = true);
    setup.sections = quizSections.slice();
    saveSetup();
    updatePoolCount();
  });
  document.getElementById('select-none-btn').addEventListener('click', () => {
    document.querySelectorAll('.section-check').forEach(cb => cb.checked = false);
    setup.sections = [];
    saveSetup();
    updatePoolCount();
  });
  document.getElementById('weak-only-toggle').addEventListener('change', (e) => {
    setup.weakOnly = e.target.checked;
    saveSetup();
    updatePoolCount();
  });
  document.getElementById('session-size-select').addEventListener('change', (e) => {
    setup.sessionSize = e.target.value === 'all' ? 'all' : Number(e.target.value);
    saveSetup();
  });
  document.getElementById('start-quiz-btn').addEventListener('click', () => startPractice());
  document.getElementById('read-through-btn').addEventListener('click', renderReadThrough);

function renderReadThrough() {
  const pool = buildPool(setup.sections, setup.weakOnly);
  const rows = pool.map(it => `
    <div class="pinyin-row">
      <span class="pinyin-main">${it.py}</span>
      <span class="pinyin-hz">${it.hz}</span>
      <div class="pinyin-en">${it.en || ''}</div>
    </div>
  `).join('');

  practiceView.innerHTML = `
    <div class="readthrough-header">Read through, then quiz yourself — priming recall like this works better than testing cold.</div>
    <div class="setup-wrap">
      <div class="setup-block">
        <div class="pinyin-list">${rows || '<div class="setup-sub">Nothing selected.</div>'}</div>
      </div>
      <div class="setup-actions">
        <button class="setup-btn-secondary" id="back-to-setup-btn">← Back to setup</button>
        <button class="setup-btn-primary" id="start-quiz-from-read-btn">Start quiz →</button>
      </div>
    </div>
  `;
  document.getElementById('back-to-setup-btn').addEventListener('click', renderSetup);
  document.getElementById('start-quiz-from-read-btn').addEventListener('click', () => startPractice());
}

function startPractice() {
  practiceStarted = true;
  const pool = buildPool(setup.sections, setup.weakOnly);
  const shuffled = shuffle(pool.slice());
  // Light weighting: weaker/unseen characters tend to sort earlier, but with
  // enough randomness that the order still feels natural, not robotic.
  let ordered = shuffled
    .map(it => ({ it, sortKey: levelWeight[masteryLevel(it.hz)] + Math.random() * 0.5 }))
    .sort((a, b) => a.sortKey - b.sortKey)
    .map(x => x.it);
  if (setup.sessionSize !== 'all' && ordered.length > setup.sessionSize) {
    ordered = ordered.slice(0, setup.sessionSize);
  }
  deck = ordered;
  totalCount = deck.length;
  learnedCount = 0;
  renderCard();
}

function renderCard() {
  revealed = false;
  if (deck.length === 0) {
    practiceView.innerHTML = `
      <div class="practice-done">
        <div style="font-size:40px;">好</div>
        <p>You went through all ${totalCount} characters.</p>
        <button id="restart-btn">Practice this session again</button>
        <div><button class="reset-stats-btn" id="new-session-btn">Choose a new session →</button></div>
        <div><button class="reset-stats-btn" id="reset-stats-btn">Reset saved progress</button></div>
      </div>
    `;
    document.getElementById('restart-btn').addEventListener('click', startPractice);
    document.getElementById('new-session-btn').addEventListener('click', renderSetup);
    document.getElementById('reset-stats-btn').addEventListener('click', () => {
      if (confirm('Clear all saved practice progress? This can\'t be undone.')) resetStats();
    });
    return;
  }
  const it = deck[0];
  const ctx = wordContext[it.hz];
  const pct = Math.round((learnedCount / totalCount) * 100);
  const level = masteryLevel(it.hz);
  const s = stats[it.hz];
  const statsLine = s ? `seen ${s.seen}× · ${Math.round((s.good / s.seen) * 100)}% got it` : '';

  let contextHtml = '';
  if (ctx) {
    if (ctx.cw) {
      const otherChars = Array.from(ctx.cw).filter(ch => ch !== it.hz && allCharInfo[ch]);
      const breakdown = otherChars
        .map(ch => `${ch} (${allCharInfo[ch].py}) = ${simpleGloss(allCharInfo[ch].en)}`)
        .join('; ');
      contextHtml += `
        <div class="flash-context-row">
          <span class="flash-context-label">Also in:</span>
          <span class="flash-context-hz">${ctx.cw}</span>
          <span class="flash-context-py">${ctx.cpy}</span>
          <span class="flash-context-en">— ${ctx.cen}</span>
          ${breakdown ? `<div class="flash-context-breakdown">${breakdown}</div>` : ''}
        </div>
      `;
    }
    if (ctx.ex) {
      const seenInEx = new Set();
      const exBreakdown = Array.from(ctx.ex)
        .filter(ch => /[\u4e00-\u9fff]/.test(ch) && allCharInfo[ch] && !seenInEx.has(ch) && seenInEx.add(ch))
        .map(ch => `${ch} (${allCharInfo[ch].py}) = ${simpleGloss(allCharInfo[ch].en)}`)
        .join('; ');
      contextHtml += `
        <div class="flash-context-row flash-context-example">
          <span class="flash-context-hz">${ctx.ex}</span>
          <span class="flash-context-py">${ctx.expy}</span>
          <span class="flash-context-en">— ${ctx.exen}</span>
          ${exBreakdown ? `<div class="flash-context-breakdown">${exBreakdown}</div>` : ''}
        </div>
      `;
    }
  }
  if (statsLine) {
    contextHtml += `<div class="flash-stats-line">${statsLine}</div>`;
  }

  practiceView.innerHTML = `
    <div class="practice-topbar">
      <button class="exit-practice" id="exit-practice">✕ Exit</button>
      <div class="progress-text" style="margin-bottom:0;">${learnedCount} / ${totalCount} learned &nbsp;·&nbsp; ${deck.length} in this round</div>
      <button class="change-session-btn" id="change-session-btn">⚙ Change session</button>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="flash-card mastery-${level}" id="flash-card">
      <div class="mastery-dot mastery-dot-${level}" title="${masteryLabel[level]}"></div>
      <div class="flash-hz">${it.hz}</div>
      <div class="flash-answer" id="flash-answer">
        <div class="flash-py">${it.py}</div>
        <div class="flash-en">${it.en || ''}</div>
        ${contextHtml}
      </div>
      <div class="flash-hint" id="flash-hint">tap the card to reveal pinyin</div>
    </div>
    <div class="flash-actions" id="flash-actions" style="display:none;">
      <button class="btn-again" id="btn-again">still learning</button>
      <button class="btn-good" id="btn-good">got it</button>
    </div>
    <div class="honesty-note">Rate yourself honestly — "got it" should mean you really knew it, not that you recognized the answer once shown.</div>
  `;
  document.getElementById('flash-card').addEventListener('click', toggleReveal);
  document.getElementById('exit-practice').addEventListener('click', () => activateTab({ view: browseView }));
  document.getElementById('change-session-btn').addEventListener('click', renderSetup);
}

function toggleReveal() {
  revealed = !revealed;
  const answer = document.getElementById('flash-answer');
  const hint = document.getElementById('flash-hint');
  const actions = document.getElementById('flash-actions');
  if (revealed) {
    answer.classList.add('show');
    hint.style.display = 'none';
    actions.style.display = 'flex';
    document.getElementById('btn-again').onclick = (e) => { e.stopPropagation(); markAgain(); };
    document.getElementById('btn-good').onclick = (e) => { e.stopPropagation(); markGood(); };
  } else {
    answer.classList.remove('show');
    hint.style.display = 'block';
    actions.style.display = 'none';
  }
}

function markGood() {
  const card = deck.shift();
  recordResult(card.hz, true);
  learnedCount++;
  renderCard();
}

function markAgain() {
  const card = deck.shift();
  recordResult(card.hz, false);
  const pos = Math.min(deck.length, 4);
  deck.splice(pos, 0, card);
  renderCard();
}

</script>
</body>
</html>
